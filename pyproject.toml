[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-analyzer"
version = "1.2.1"
description = "Collect canonical social relationship URLs through a visible authenticated Chrome session."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "OSINT Cabal"},
]
keywords = ["browser", "cdp", "contacts", "osint", "social-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "requests>=2.32.0,<3",
  "rich>=13.7.0,<15",
  "websocket-client>=1.8.0,<2",
]

[project.urls]
Homepage = "https://github.com/OSINTCabal/Contact-Analyzer"
Documentation = "https://github.com/OSINTCabal/Contact-Analyzer#readme"
Repository = "https://github.com/OSINTCabal/Contact-Analyzer.git"
Issues = "https://github.com/OSINTCabal/Contact-Analyzer/issues"

[project.scripts]
contactanalyzer = "contactanalyzer_app.cli:main"

[tool.setuptools.packages.find]
include = ["contactanalyzer_app*"]

[tool.setuptools.package-data]
contactanalyzer_app = ["*.json"]
