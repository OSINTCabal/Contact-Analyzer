name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: bash -n install.sh contactanalyzer scripts/launch-chrome.sh
      - name: Verify supported Linux package mappings
        run: |
          for id in fedora debian ubuntu linuxmint kali; do
            CONTACT_ANALYZER_DISTRO_ID="$id" ./install.sh --system-requirements >/dev/null
          done
      - run: python -m unittest discover -s tests -v
